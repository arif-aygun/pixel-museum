name: pixel-museum-daily
on:
  schedule:
    - cron: "7 4 * * *"      # her gün 07:07 (TR saati)
  workflow_dispatch:          # Actions sekmesinden elle de çalıştırılabilir
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow requests
      - run: python -m unittest discover -s tests
      - run: python pixel_art_of_the_day.py
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - name: Commit
        run: |
          git config user.name "pixel-museum-bot"
          git config user.email "pixel-museum-bot@users.noreply.github.com"
          git add docs && git commit -m "art: $(date +%F)" || echo "değişiklik yok"
          git push

      # ---- Discord widget (ŞU AN KAPALI) ----
      # Discord yeni uygulamalarda widget'ı kapattı. Resmi özellik açılınca:
      #   1) Repo Settings > Secrets'a DISCORD_APP_ID, DISCORD_USER_ID, DISCORD_BOT_TOKEN ekle
      #   2) Aşağıdaki "if: false" satırını sil
      # Format Chloe Cinders'ın rehberindeki örnekten: type 1 = metin, type 3 = görsel URL.
      - name: Update Discord widget
        if: false
        run: |
          BODY=$(jq -n --arg i "$(jq -r .image_url docs/today.json)" --arg c "$(jq -r .caption docs/today.json)" \
            '{username:"Pixel Museum", data:{dynamic:[{type:3,name:"art_image",value:{url:$i}},{type:1,name:"art_caption",value:$c}]}}')
          curl -sf -X PATCH "https://discord.com/api/v9/applications/${{ secrets.DISCORD_APP_ID }}/users/${{ secrets.DISCORD_USER_ID }}/identities/0/profile" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bot ${{ secrets.DISCORD_BOT_TOKEN }}" \
            -H "User-Agent: DiscordBot (https://github.com/discord/discord-api-docs, 1.0.0)" \
            -d "$BODY"
